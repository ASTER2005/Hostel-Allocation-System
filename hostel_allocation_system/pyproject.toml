[project]
name = "hostel-allocation-system"
version = "1.0.0"
description = "Hostel Allocation and Management System for College"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.0",
    "Flask-Login>=0.6.3",
    "Flask-WTF>=1.2.1",
    "email-validator>=2.0.0",
    "PyMySQL>=1.1.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "Werkzeug>=3.0.0",
    "gunicorn>=21.0.0"
]

[tool.vercel]
entrypoint = "run:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
